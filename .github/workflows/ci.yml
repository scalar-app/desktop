name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --all --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # The app is the web app: it is built here and bundled as static files.
      - uses: actions/checkout@v4
        with:
          path: desktop
      - uses: actions/checkout@v4
        with:
          repository: scalar-app/web
          path: web
      - uses: actions/checkout@v4
        with:
          repository: scalar-app/ui
          path: ui
      - uses: actions/checkout@v4
        with:
          repository: scalar-app/sdk
          path: sdk

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build linked packages
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
          pnpm --dir sdk install --frozen-lockfile
          pnpm --dir sdk build

      - run: pnpm install --frozen-lockfile
        working-directory: desktop

      - name: Build the app
        run: pnpm build
        working-directory: desktop
